lang: es

# Parametros especificos de formato para salida HTML.
format:
  html:
    # Configuracion de temas visuales personalizados (Light y Dark).
    theme:
      light:
        - cosmo
        - miku-theme.scss
      dark:
        - darkly
        - miku-theme.scss
    # Habilita la generacion automatica de la tabla de contenidos (TOC).
    toc: true
    # Motor de visualizacion para formulas matematicas en el navegador.
    html-math-method: mathjax
    # Permite ocultar el codigo fuente bajo pestañas expandibles por defecto.
    code-fold: true
    # Añade un boton de copiado directo en cada bloque de codigo.
    code-copy: true
    # Utiliza un layout de pagina completo sin restricciones estrechas de ancho.
    page-layout: full
