# ==============================================================================
# CONFIGURACION CENTRAL DE COMPILACION Y CONFIGURACION DE QUARTO (_quarto.yml)
# ==============================================================================
# Este archivo define la estructura de navegacion del sitio web, el motor de
# renderizado matematico, los temas visuales y la copia de recursos estaticos.
# ==============================================================================

project:
  # Define que el proyecto es un sitio web estatico.
  type: website
  # Especifica el directorio de salida del sitio web compilado (ADR-007).
  output-dir: site
  render:
    - src/
  # Recursos estaticos adicionales que se copiaran directamente al directorio final.
  # Copia todos los graficos SVG generados (incluidos los de Typst) de forma recursiva.
  resources:
  - src/**/*.svg

website:
  # Nombre principal del proyecto.
  title: Polaris Kernel
  # URL base de publicacion en GitHub Pages.
  site-url: https://nerudev.github.io/Polaris-Kernel/
  # Habilita el cuadro de busqueda global.
  search: true
  
  # Configuracion de la barra de navegacion lateral.
  sidebar:
    style: docked
    search: true
    # Mapeo estructurado de los contenidos en los 6 pilares Bourbaki.
    contents:
    # Pilar 01: Fundamentos de las matematicas y logica formal.
    - section: 01 Fundamentos Logica
      contents:
      - src/01_fundamentos_logica/01_aritmetica_propiedades.qmd
      - src/01_fundamentos_logica/01_sistemas_numericos.qmd
      - src/01_fundamentos_logica/02_logica_matematica.qmd
      - src/01_fundamentos_logica/03_teoria_conjuntos.qmd
      - src/01_fundamentos_logica/04_metodos_demostracion.qmd
      - src/01_fundamentos_logica/05_relaciones_equivalencia.qmd
      - src/01_fundamentos_logica/06_funciones_y_mapeos.qmd
      - src/01_fundamentos_logica/07_logica_predicados_inferencia.qmd
      
    # Pilar 02: Estructuras algebraicas y algebra lineal.
    - section: 02 Estructuras Algebraicas
      contents:
      - src/02_estructuras_algebraicas/01_algebra_elemental.qmd
      - src/02_estructuras_algebraicas/02_algebra_lineal.qmd
      - src/02_estructuras_algebraicas/03_algebra_abstracta.qmd
      - src/02_estructuras_algebraicas/04_teoria_de_categorias.qmd
      - src/02_estructuras_algebraicas/05_teoria_de_matrices.qmd
      - src/02_estructuras_algebraicas/06_ecuaciones_y_desigualdades.qmd
      - src/02_estructuras_algebraicas/07_polinomios_y_factorizacion.qmd
      - src/02_estructuras_algebraicas/08_espacios_vectoriales_bases.qmd
      
    # Pilar 03: Calculo infinitesimal, analisis real y funcional.
    - section: 03 Analisis Continuidad
      contents:
      - src/03_analisis_continuidad/01_funciones_y_limites.qmd
      - src/03_analisis_continuidad/02_calculo_diferencial.qmd
      - src/03_analisis_continuidad/03_calculo_integral.qmd
      - src/03_analisis_continuidad/04_calculo_multivariable.qmd
      - src/03_analisis_continuidad/05_ecuaciones_diferenciales.qmd
      - src/03_analisis_continuidad/06_analisis_avanzado.qmd
      - src/03_analisis_continuidad/07_analisis_funcional.qmd
      - src/03_analisis_continuidad/08_sucesiones_y_series.qmd
      
    # Pilar 04: Geometria, topologia y variedades diferenciables.
    - section: 04 Espacio Forma
      contents:
      - src/04_espacio_forma/01_geometria_euclidiana.qmd
      - src/04_espacio_forma/02_trigonometria.qmd
      - src/04_espacio_forma/03_geometria_analitica.qmd
      - src/04_espacio_forma/04_topologia.qmd
      - src/04_espacio_forma/05_geometria_diferencial.qmd
      - src/04_espacio_forma/06_geometria_no_euclidiana.qmd
      
    # Pilar 05: Matematicas discretas, teoria de grafos y computacion.
    - section: 05 Discrecion Computacion
      contents:
      - src/05_discrecion_computacion/01_combinatoria.qmd
      - src/05_discrecion_computacion/02_teoria_de_grafos.qmd
      - src/05_discrecion_computacion/03_teoria_de_numeros.qmd
      - src/05_discrecion_computacion/04_metodos_numericos.qmd
      - src/05_discrecion_computacion/05_teoria_automatas.qmd
      
    # Pilar 06: Probabilidad, procesos estocasticos e inferencia de datos.
    - section: 06 Estocastica Incertidumbre
      contents:
      - src/06_estocastica_incertidumbre/01_estadistica_descriptiva.qmd
      - src/06_estocastica_incertidumbre/02_teoria_de_probabilidad.qmd
      - src/06_estocastica_incertidumbre/03_estadistica_inferencial.qmd
      - src/06_estocastica_incertidumbre/04_modelos_estocasticos.qmd
      - src/06_estocastica_incertidumbre/05_teoria_informacion.qmd

# Idioma de localizacion por defecto para el sitio generado (Español).
lang: es

# Parametros especificos de formato para salida HTML.
format:
  html:
    # Configuracion de temas visuales personalizados (Light y Dark).
    theme:
      light:
        - cosmo
        - miku-theme.scss
      dark:
        - darkly
        - miku-theme.scss
    # Habilita la generacion automatica de la tabla de contenidos (TOC).
    toc: true
    # Motor de visualizacion para formulas matematicas en el navegador.
    html-math-method: mathjax
    # Permite ocultar el codigo fuente bajo pestañas expandibles por defecto.
    code-fold: true
    # Añade un boton de copiado directo en cada bloque de codigo.
    code-copy: true
    # Utiliza un layout de pagina completo sin restricciones estrechas de ancho.
    page-layout: full
